name: CI

# Runs on every push and pull request: unit tests + a release build on a real Windows runner.
# The exe is kept as a workflow artifact (7 days) so a failing build is caught before release.sh.
on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v6
        with:
          name: clipper-exe
          path: src-tauri/target/release/clipper.exe
          retention-days: 7
