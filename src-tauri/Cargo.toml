[package]
name = "clipper"
version = "0.1.9"
edition = "2021"

[lib]
name = "clipper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
chrono = "0.4"
semver = "1"
tauri-plugin-single-instance = "2"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_JobObjects", "Win32_Security"] }
